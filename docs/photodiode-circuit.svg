<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img" aria-labelledby="title desc">
<title id="title">Two-channel Arduino photodiode reference circuit</title>
<desc id="desc">Each photodiode cathode connects to board 3.3 volts. Each anode connects to a separate A0 or A1 ADC node and an independent 10 kilohm resistor to common ground. No capacitors or direct node to ground shorts.</desc>
<rect width="1000" height="670" fill="white"/>
<g font-family="Arial, sans-serif" fill="#182333" font-size="19">
<text x="40" y="40" font-size="26" font-weight="bold">Photodiode logger — reusable reference circuit</text>
<text x="40" y="75">Classic Nano / Uno • 5 V ATmega328P • DEFAULT ADC reference = AVcc</text>
<text x="40" y="105">Reference wiring only; historical wiring and bias are not established.</text>
<g stroke="#23384c" stroke-width="3" fill="none">
