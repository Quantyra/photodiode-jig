<text x="40" y="161">Board 3.3 V</text>
<text x="385" y="230">K (cathode)</text><text x="685" y="230">K (cathode)</text>
<text x="385" y="280">A (anode)</text><text x="685" y="280">A (anode)</text>
<text x="40" y="331">Board A0</text><text x="830" y="341">Board A1</text>
<text x="385" y="420">10 kohm</text><text x="685" y="420">10 kohm</text>
<text x="40" y="480">Channel A / right port</text><text x="700" y="480">Channel B / left port</text>
<text x="540" y="547">Shared board GND</text>
<text x="40" y="595">Port positions: viewed from source facing jig. Verify actual mapping and diode pinout.</text>
<text x="40" y="625">Separate signal nodes • no capacitors • leave AREF unconnected • LED source independent</text>
<text x="40" y="652">See setup guide for single-port unused-input termination and source current limiting.</text>
